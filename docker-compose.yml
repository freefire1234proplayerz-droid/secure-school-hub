services:
  db:
    image: postgres:16-alpine
    container_name: sshub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: secure_school_hub
      POSTGRES_PASSWORD: secure_school_hub
      POSTGRES_DB: secure_school_hub
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend

  server:
    build: ./server
    container_name: sshub_server
    restart: unless-stopped
    env_file:
      - ./server/.env
    depends_on:
      - db
    ports:
      - "4000:4000"
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge

